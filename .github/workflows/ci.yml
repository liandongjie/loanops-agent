name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  h2-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on H2
        run: mvn --batch-mode --no-transfer-progress clean verify

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: loanops
          MYSQL_USER: loanops
          MYSQL_PASSWORD: loanops_dev
          MYSQL_ROOT_PASSWORD: loanops_root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ploanops_root_dev --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: loanops
      MYSQL_USER: loanops
      MYSQL_PASSWORD: loanops_dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on MySQL
        run: mvn --batch-mode --no-transfer-progress clean verify