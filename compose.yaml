services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loanops}
      MYSQL_USER: ${MYSQL_USER:-loanops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loanops_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-loanops_root_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - loanops_mysql_data:/var/lib/mysql

volumes:
  loanops_mysql_data: