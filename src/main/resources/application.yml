spring:
  datasource:
    url: jdbc:h2:mem:loanops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  ai:
    model:
      chat: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true