spring:
  datasource:
    url: jdbc:h2:mem:loanops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  ai:
    model:
      chat: none
      embedding: none
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

loanops:
  audit:
    include-content: false
  conversation:
    history-message-limit: 20
  policy:
    chunk-max-characters: ${POLICY_CHUNK_MAX_CHARACTERS:1200}
    retrieval-top-k: ${POLICY_RETRIEVAL_TOP_K:5}
    parent-expansion-depth: ${POLICY_PARENT_EXPANSION_DEPTH:1}
    parent-expansion-max-characters: ${POLICY_PARENT_EXPANSION_MAX_CHARACTERS:1600}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
