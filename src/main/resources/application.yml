spring:
  config:
    import: "optional:file:./.env[.properties]"
  http:
    client:
      connect-timeout: ${LOANOPS_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${LOANOPS_HTTP_READ_TIMEOUT:60s}
  datasource:
    url: jdbc:h2:mem:loanops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  ai:
    model:
      chat: none
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    retry:
      max-attempts: 1
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

loanops:
  agent:
    provider: ${LOANOPS_CHAT_PROVIDER:deepseek}
    adapter: ${LOANOPS_CHAT_ADAPTER:deepseek}
    model: ${LOANOPS_CHAT_MODEL:deepseek-chat}
    max-message-characters: ${LOANOPS_AGENT_MAX_MESSAGE_CHARACTERS:4000}
  audit:
    include-content: false
  conversation:
    history-message-limit: 20
    history-character-limit: ${LOANOPS_CONVERSATION_HISTORY_CHARACTER_LIMIT:12000}
  policy:
    chunk-max-characters: ${POLICY_CHUNK_MAX_CHARACTERS:1200}
    retrieval-top-k: ${POLICY_RETRIEVAL_TOP_K:5}
    parent-expansion-depth: ${POLICY_PARENT_EXPANSION_DEPTH:1}
    parent-expansion-max-characters: ${POLICY_PARENT_EXPANSION_MAX_CHARACTERS:1600}
    runtime:
      enabled: ${POLICY_RETRIEVAL_ENABLED:true}
      query-prior-user-limit: ${POLICY_QUERY_PRIOR_USER_LIMIT:3}
      query-max-characters: ${POLICY_QUERY_MAX_CHARACTERS:1200}
      context-max-evidence: ${POLICY_CONTEXT_MAX_EVIDENCE:5}
      context-max-characters: ${POLICY_CONTEXT_MAX_CHARACTERS:6000}
      score-threshold: ${POLICY_SCORE_THRESHOLD:0.60}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
