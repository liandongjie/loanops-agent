spring:
  config:
    activate:
      on-profile: policy
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

loanops:
  policy:
    qdrant:
      base-url: ${QDRANT_BASE_URL:http://localhost:6333}
      collection: ${QDRANT_COLLECTION:loanops_policy_chunks}
      api-key: ${QDRANT_API_KEY:}
