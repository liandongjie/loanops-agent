spring:
  config:
    activate:
      on-profile: ai
  ai:
    model:
      chat: ${loanops.agent.adapter}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          # Spring AI 1.1.1 officially supports deepseek-chat / deepseek-reasoner.
          # Keep it configurable so a supported provider model can be changed without code changes.
          model: ${loanops.agent.model}
          temperature: 0.2
    ollama:
      chat:
        options:
          model: ${loanops.agent.model}
